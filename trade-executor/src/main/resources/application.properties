server.port=8011
spring.application.name=trade-executor

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1

# Retry a failed risk.validated message (order placement/paper trade) up to 3 times
# with exponential backoff (1s, 2s, 4s) before it is handed to the
# RepublishMessageRecoverer and published to risk.validated.dlq (see RabbitConfig)
# instead of being rejected and lost.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

trade.paper-mode=${PAPER_TRADING_MODE:true}

# ── Position monitor ────────────────────────────────────────────────────────
# Polls the strict LTP endpoint for held symbols and closes on the stop/target
# that arrived with the signal. 30s is a compromise: the exit is only ever as
# precise as this interval, and the endpoint hits Groww, which 403s under load.
trade.monitor.interval-ms=${POSITION_MONITOR_INTERVAL_MS:30000}
trade.monitor.initial-delay-ms=${POSITION_MONITOR_INITIAL_DELAY_MS:20000}
trade.monitor.max-price-age-minutes=${POSITION_MAX_PRICE_AGE_MIN:10}

backend.url=${BACKEND_URL:http://backend:8000}
feedback.url=${FEEDBACK_URL:http://feedback-service:8012}
groww.api.base-url=${GROWW_API_BASE_URL:https://groww.in/v1/api}
groww.api.token=${GROWW_API_TOKEN:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
